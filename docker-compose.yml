services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: poc-ai-service
    network_mode: "host"
    volumes:
      - ./ai-service:/app
      - ./python/models:/app/models
      - /tmp/storage/videos:/app/videos
    environment:
      - USE_GPU=true
      - PORT=8081
      - AI_WEBHOOK_SECRET=dev-webhook-secret-2025
      - MODEL_PATH=/app/models/bjj_custom.pt
      - LOCAL_MODEL_PATH=/app/models/bjj_pose_classifier.pkl
      - LABEL_MAPPING_PATH=/app/models/label_mapping.json
      # Roboflow — visual submission/sweep/transition confirmation
      # Get key at roboflow.com → workspace bjj-885sh → project bjj-positions-eexsh
      - ROBOFLOW_API_KEY=oBv2mUmqvMgUr8TjqUTW
      # Multiple keys: comma-separated OR indexed vars (GEMINI_API_KEY_1, _2, ...)
      - GEMINI_API_KEY=AIzaSyDicE2Q40cRJOb2Eo2oa-SypQw0MBPClmU
      - GEMINI_API_KEY_2=AIzaSyDZf0AL8X2Zvk0rftEGc_kSqfBn0MSI_BU
      - GEMINI_API_KEY_3=AIzaSyCrrb0pNX-8gt6gY3ZMRKPfGUQAXwWom3g
      - GEMINI_MODEL=gemini-2.0-flash
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Spring Boot application (to be run separately for now)
